<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conway's Game of Life</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #000;
            color: white;
        }
        table {
            padding: 10px;
        }
        td {
            text-align: center;
            padding: 5px;
        }
        select {
            width: 80px;
            text-align: center;
        }
        input {
            width: 20px;
        }
        canvas {
            border: 1px solid cyan;
            width: 98%;
            height: 98%;
        }
        #control {
            position: absolute;
            background-color: #000;
            border: 1px solid cyan;
            border-spacing: 2px;
            bottom:20px;
            left: 20px;
            padding: 10px;

        }
        /* select, button {
            margin-bottom: 10px;
        } */
    </style>
</head>
<body>
    <div id="control">

        <table border="1">
            <tr>
                <td>
                    <label>start pattern</label>
                </td>
                <td>
                    <select id="ddPattern">
                    </select>
                </td>
                
            </tr>
            
            <tr>
                <td>
                    <label>delay</label>
                </td>
                <td>

                    <input id="rnDelay" type="range" min="0", max="6" value="0" style="width:80px"></select>
                    <br/>
                    <label id="lbDelay" style="width:680px"></label>
                </td>
                
            </tr>
            
            <tr>

                <td>
                    <label id="lbGenerationLabel">generation</label>
                </td>
                <td>
                    <label id="lbGeneration">0</label>
                </td>
                
            </tr>
        </table>

        <div style="text-align: center">
            <button id="bnGo">go</button>
            <button id="bnStep">step</button>
        </div>

        
    </div>

    <canvas id="gameCanvas"></canvas>
    <script src="game.js" type="module"></script>
</body>
</html>
